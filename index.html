<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTogether Task Management Board</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-users"></i> GoTogether Task Board</h1>
                <div class="header-controls">
                    <div class="search-container">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search tasks...">
                    </div>
                    <div class="filter-group">
                        <select id="priorityFilter">
                            <option value="">All Priorities</option>
                            <option value="high">High Priority</option>
                            <option value="medium">Medium Priority</option>
                            <option value="low">Low Priority</option>
                        </select>
                        <select id="assigneeFilter">
                            <option value="">All Assignees</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Product">Product</option>
                            <option value="Growth">Growth</option>
                            <option value="Operations">Operations</option>
                            <option value="CEO">CEO</option>
                        </select>
                    </div>
                    <button id="addTaskBtn" class="add-task-btn">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                </div>
            </div>
        </header>

        <!-- Kanban Board -->
        <div class="board">
            <div class="column" data-status="todo">
                <div class="column-header">
                    <h3><i class="fas fa-clock"></i> To Do</h3>
                    <span class="task-count">0</span>
                </div>
                <div class="task-list" id="todo-list">
                    <!-- Tasks will be dynamically added here -->
                </div>
            </div>

            <div class="column" data-status="inprogress">
                <div class="column-header">
                    <h3><i class="fas fa-play"></i> In Progress</h3>
                    <span class="task-count">0</span>
                </div>
                <div class="task-list" id="inprogress-list">
                    <!-- Tasks will be dynamically added here -->
                </div>
            </div>

            <div class="column" data-status="review">
                <div class="column-header">
                    <h3><i class="fas fa-eye"></i> Review</h3>
                    <span class="task-count">0</span>
                </div>
                <div class="task-list" id="review-list">
                    <!-- Tasks will be dynamically added here -->
                </div>
            </div>

            <div class="column" data-status="done">
                <div class="column-header">
                    <h3><i class="fas fa-check"></i> Done</h3>
                    <span class="task-count">0</span>
                </div>
                <div class="task-list" id="done-list">
                    <!-- Tasks will be dynamically added here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Task</h2>
                <span class="close">&times;</span>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Task Title *</label>
                    <input type="text" id="taskTitle" required>
                </div>

                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskAssignee">Assignee</label>
                        <select id="taskAssignee">
                            <option value="Marketing">Marketing</option>
                            <option value="Product">Product</option>
                            <option value="Growth">Growth</option>
                            <option value="Operations">Operations</option>
                            <option value="CEO">CEO</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate">
                    </div>

                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus">
                            <option value="todo">To Do</option>
                            <option value="inprogress">In Progress</option>
                            <option value="review">Review</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="taskComments">Comments</label>
                    <textarea id="taskComments" rows="2"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" id="deleteTaskBtn" class="delete-btn">Delete</button>
                    <div class="action-buttons">
                        <button type="button" class="cancel-btn">Cancel</button>
                        <button type="submit" class="save-btn">Save Task</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
